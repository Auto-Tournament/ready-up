name: Build

# Release build of libserver.so + plugins in Valve's Steam Runtime 3 "sniper" SDK (glibc 2.31,
# what CS2 targets), verified against the CURRENT public CS2 build (sigcheck + hook-site check,
# base gamedata + every fragment). Every run uploads the install zips as workflow artifacts:
# ready-up-{core,match,fleet,practice,essentials-plugin,skins,hello,midas,whitelist}-<version>-linuxsteamrt64.zip
# (components), ready-up-{essentials,full}-<version>-linuxsteamrt64.zip (bundles) + SHA256SUMS.
# The installer job then tests install.sh against those zips. Tags v* additionally publish a
# GitHub release with the same files.

on:
  push:
    branches: [master, main, 'dev/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build (sniper) + verify vs current CS2
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    env:
      DEPS_PREFIX: ${{ github.workspace }}/.ci/deps
      DEPS_WORK: ${{ github.workspace }}/.ci/deps-work
      DD_DIR: ${{ github.workspace }}/.ci/depotdownloader
      CS2_DIR: ${{ github.workspace }}/.ci/cs2
    outputs:
      version: ${{ steps.version.outputs.version }}
      buildid: ${{ steps.cs2.outputs.buildid }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          file_version="$(tr -d ' \t\r\n' < VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$file_version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($file_version)"
              exit 1
            fi
          else
            version="${file_version}-dev.$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Unit tests (patch_gameinfo.py, compat-report.py)
        run: python3 -m unittest discover -s tests -v

      - name: Cache static deps (OpenSSL, libcurl)
        uses: actions/cache@v4
        with:
          path: .ci/deps
          key: sniper-static-deps-${{ hashFiles('scripts/ci/build-static-deps.sh') }}

      - name: Build libserver.so + plugins + tools
        run: scripts/ci/build-release.sh build-sniper

      - name: Plugin host test (ctest)
        run: cd build-sniper && ctest --output-on-failure

      - name: Current CS2 buildid
        id: cs2
        run: echo "buildid=$(scripts/ci/cs2-buildid.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache CS2 binaries for this buildid
        id: cs2-cache
        uses: actions/cache@v4
        with:
          path: .ci/cs2
          key: cs2-linux-bins-${{ steps.cs2.outputs.buildid }}

      - name: Fetch CS2 binaries (DepotDownloader, anonymous, 5 files)
        if: steps.cs2-cache.outputs.cache-hit != 'true'
        run: scripts/ci/fetch-cs2-binaries.sh "$CS2_DIR"

      - name: sigcheck + hookcheck vs current CS2
        run: |
          set +e
          scripts/ci/verify-cs2.sh "$CS2_DIR" build-sniper .ci/report.md
          rc=$?
          cat .ci/report.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Package (component zips + bundles + SHA256SUMS)
        run: |
          . "$CS2_DIR/cs2-build.env"
          CS2_BUILDID="$BUILDID" CS2_PATCH_VERSION="$PATCH_VERSION" \
            scripts/package-release.sh build-sniper "${{ steps.version.outputs.version }}" dist
          mkdir -p dist-info
          cp "$CS2_DIR/cs2-build.env" .ci/report.md dist-info/

      - name: Check bundles (essentials has match + fleet + practice + essentials and no skins; core has neither)
        run: scripts/ci/check-bundles.sh dist "${{ steps.version.outputs.version }}"

      # One artifact with everything (what the installer job and the release use), plus one
      # per zip so a single zip can be downloaded from the run page. Artifacts only: no
      # release is created here.
      - name: Upload artifact (all zips)
        uses: actions/upload-artifact@v4
        with:
          name: ready-up-${{ steps.version.outputs.version }}-linuxsteamrt64
          path: |
            dist/
            dist-info/
          if-no-files-found: error
          retention-days: 30

      - name: Upload ready-up-essentials
        uses: actions/upload-artifact@v4
        with:
          name: ready-up-essentials-${{ steps.version.outputs.version }}
          path: dist/ready-up-essentials-${{ steps.version.outputs.version }}-linuxsteamrt64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload ready-up-full
        uses: actions/upload-artifact@v4
        with:
          name: ready-up-full-${{ steps.version.outputs.version }}
          path: dist/ready-up-full-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload ready-up-core
        uses: actions/upload-artifact@v4
        with:
          name: ready-up-core-${{ steps.version.outputs.version }}
          path: dist/ready-up-core-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload ready-up-match
        uses: actions/upload-artifact@v4
        with:
          name: ready-up-match-${{ steps.version.outputs.version }}
          path: dist/ready-up-match-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload ready-up-fleet
        uses: actions/upload-artifact@v4
        with:
          name: ready-up-fleet-${{ steps.version.outputs.version }}
          path: dist/ready-up-fleet-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload ready-up-skins
        uses: actions/upload-artifact@v4
        with:
          name: ready-up-skins-${{ steps.version.outputs.version }}
          path: dist/ready-up-skins-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload ready-up-practice
        uses: actions/upload-artifact@v4
        with:
          name: ready-up-practice-${{ steps.version.outputs.version }}
          path: dist/ready-up-practice-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload ready-up-essentials-plugin
        uses: actions/upload-artifact@v4
        with:
          name: ready-up-essentials-plugin-${{ steps.version.outputs.version }}
          path: dist/ready-up-essentials-plugin-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload ready-up-hello
        uses: actions/upload-artifact@v4
        with:
          name: ready-up-hello-${{ steps.version.outputs.version }}
          path: dist/ready-up-hello-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload ready-up-midas
        uses: actions/upload-artifact@v4
        with:
          name: ready-up-midas-${{ steps.version.outputs.version }}
          path: dist/ready-up-midas-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload ready-up-whitelist
        uses: actions/upload-artifact@v4
        with:
          name: ready-up-whitelist-${{ steps.version.outputs.version }}
          path: dist/ready-up-whitelist-*.zip
          if-no-files-found: error
          retention-days: 30

  installer:
    name: Installer (install.sh vs the built zips)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ready-up-${{ needs.build.outputs.version }}-linuxsteamrt64
          path: artifact

      - name: shellcheck
        run: shellcheck install.sh scripts/package-release.sh scripts/ci/check-bundles.sh tests/installer/test_install.sh

      - name: install.sh end-to-end (fake server trees, Metamod, rerun, pickers, release mode, uninstall)
        run: tests/installer/test_install.sh artifact/dist

  release:
    name: GitHub release
    needs: [build, installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: ready-up-${{ needs.build.outputs.version }}-linuxsteamrt64
          path: artifact

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          files=(artifact/dist/ready-up-*-"${VERSION}"-linuxsteamrt64.zip artifact/dist/SHA256SUMS)
          scripts/ci/release-notes.sh "$TAG" artifact/dist-info/cs2-build.env > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "${files[@]}" \
              --title "Ready Up $TAG" --notes-file notes.md --verify-tag --latest
          fi

      - name: Announce on Discord
        if: env.DISCORD_WEBHOOK_URL != ''
        run: ./discord-webhook.sh "${{ needs.build.outputs.version }}" || echo "::warning::Discord announcement failed"
