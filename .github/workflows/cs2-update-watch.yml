name: CS2 update watch

# Every 15 minutes (best effort: GitHub may run it much later), and on workflow_dispatch from
# scripts/ci/cs2-poll.sh (a poller on any always-on box, every 2-3 minutes; docs/CS2-COMPAT.md):
# read CS2's public buildid (api.steamcmd.net). When it (or the
# engine surface on the default branch) changed since the last check, download ONLY the
# needed Linux server files anonymously (DepotDownloader, depots 2347773 + 2347770, ~18 MB)
# and verify gamedata/engine-surface.json with readyup_sigcheck + readyup_hookcheck.
#
#   fail -> failing job + markdown summary, open/refresh issue labeled `cs2-update`,
#           Discord post if secret DISCORD_WEBHOOK_URL is set; readyup_sigfix (tools/sigfix.h)
#           tries to repair the failing signatures, and if it changed any, a PR on branch
#           cs2-autofix/<buildid> carries them. Never merged automatically: a wrong match calls
#           the wrong function, so a human reviews it.
#   pass -> "CS2 build N verified" (on the open issue, which is closed; else on the commit)
#
#   both -> compat.json + badge.json (scripts/ci/compat-report.py): per-component result in the
#           contract of docs/CS2-COMPAT.md (core, skins, and every plugin through its
#           plugins/<name>/needs.json), committed to `cs2-build` (README badge). A new verdict
#           starts .github/workflows/cs2-dynamic.yml (real server; off until enabled)
#
# Progress events: when repo variable COMPAT_INGEST_URL is set, every phase (queued ->
# checking -> pass/warn/fail, or no_verdict) is POSTed there as compat.json with
# `Authorization: Bearer <secret COMPAT_INGEST_TOKEN>`. A failed POST is logged, never fatal.
#
# State (last buildid + surface hash + result + compat.json/badge.json) lives on the orphan
# branch `cs2-build`. Optional repo variable CS2_WATCH_RUNNER picks the runner for the cheap
# 15-minute check (e.g. a self-hosted label) instead of a GitHub-hosted one.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Verify even if the buildid and engine surface are unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cs2-update-watch
  cancel-in-progress: false

jobs:
  check:
    name: Poll CS2 buildid
    runs-on: ${{ vars.CS2_WATCH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      buildid: ${{ steps.poll.outputs.buildid }}
      surface_sha: ${{ steps.poll.outputs.surface_sha }}
      changed: ${{ steps.poll.outputs.changed }}
      trigger: ${{ steps.poll.outputs.trigger }}
      started_at: ${{ steps.poll.outputs.started_at }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci
            gamedata
            plugins

      - name: Compare with last verified state
        id: poll
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          buildid="$(scripts/ci/cs2-buildid.sh)"
          # engine surface + every plugin's needs (plugins/<name>/needs.json: per-plugin verdicts)
          surface="$(cat gamedata/engine-surface.json gamedata/engine-surface.*.json plugins/*/needs.json | sha256sum | cut -d' ' -f1)"
          state="$(scripts/ci/cs2-watch-state.sh read)"
          prev_build="$(printf '%s\n' "$state" | sed -n 's/^BUILDID=//p')"
          prev_surface="$(printf '%s\n' "$state" | sed -n 's/^SURFACE_SHA256=//p')"
          prev_status="$(printf '%s\n' "$state" | sed -n 's/^STATUS=//p')"
          changed=true
          if [ "$buildid" != "$prev_build" ]; then trigger=build_change
          elif [ "$surface" != "$prev_surface" ]; then trigger=surface_change
          elif [ "$FORCE" = "true" ]; then trigger=manual
          else changed=false trigger=
          fi
          {
            echo "buildid=$buildid"
            echo "surface_sha=$surface"
            echo "changed=$changed"
            echo "trigger=$trigger"
            echo "started_at=$started_at"
          } >> "$GITHUB_OUTPUT"
          echo "CS2 buildid $buildid (last checked: ${prev_build:-none}, ${prev_status:-n/a}); surface ${surface:0:12} (last ${prev_surface:0:12}); changed=$changed ${trigger}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 'Progress event: queued'
        if: steps.poll.outputs.changed == 'true'
        continue-on-error: true
        env:
          COMPAT_INGEST_URL: ${{ vars.COMPAT_INGEST_URL }}
          COMPAT_INGEST_TOKEN: ${{ secrets.COMPAT_INGEST_TOKEN }}
        run: |
          [ -n "$COMPAT_INGEST_URL" ] || exit 0
          python3 scripts/ci/compat-report.py phase queued --out .ci/queued.json \
            --buildid "${{ steps.poll.outputs.buildid }}" --trigger "${{ steps.poll.outputs.trigger }}" \
            --started-at "${{ steps.poll.outputs.started_at }}"
          python3 scripts/ci/compat-report.py post .ci/queued.json

  verify:
    name: Verify engine surface vs CS2 ${{ needs.check.outputs.buildid }}
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    env:
      DD_DIR: ${{ github.workspace }}/.ci/depotdownloader
      CS2_DIR: ${{ github.workspace }}/.ci/cs2
    outputs:
      verdict: ${{ steps.verify.outputs.verdict }}
      patch_version: ${{ steps.verify.outputs.patch_version }}
      autofix: ${{ steps.autofix.outputs.changed }}
      autofix_verified: ${{ steps.autofix.outputs.verified }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache CS2 binaries for this buildid
        id: cs2-cache
        uses: actions/cache@v4
        with:
          path: .ci/cs2
          key: cs2-linux-bins-${{ needs.check.outputs.buildid }}

      - name: Fetch CS2 binaries (DepotDownloader, anonymous, 5 files)
        if: steps.cs2-cache.outputs.cache-hit != 'true'
        run: scripts/ci/fetch-cs2-binaries.sh "$CS2_DIR"

      - name: 'Progress event: checking'
        continue-on-error: true
        env:
          COMPAT_INGEST_URL: ${{ vars.COMPAT_INGEST_URL }}
          COMPAT_INGEST_TOKEN: ${{ secrets.COMPAT_INGEST_TOKEN }}
        run: |
          [ -n "$COMPAT_INGEST_URL" ] || exit 0
          python3 scripts/ci/compat-report.py phase checking --out .ci/checking.json \
            --build-env "$CS2_DIR/cs2-build.env" --buildid "${{ needs.check.outputs.buildid }}" \
            --trigger "${{ needs.check.outputs.trigger }}" --started-at "${{ needs.check.outputs.started_at }}"
          python3 scripts/ci/compat-report.py post .ci/checking.json

      - name: Build readyup_sigcheck + readyup_hookcheck + readyup_sigfix
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          CC=gcc-14 CXX=g++-14 cmake -S . -B build-tools -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build build-tools --target readyup_sigcheck readyup_hookcheck readyup_sigfix -j"$(nproc)"

      - name: sigcheck + hookcheck -> report.md, compat.json, badge.json
        id: verify
        env:
          VERIFY_RAW_DIR: .ci/raw
        run: |
          . "$CS2_DIR/cs2-build.env"
          echo "patch_version=$PATCH_VERSION" >> "$GITHUB_OUTPUT"
          set +e
          scripts/ci/verify-cs2.sh "$CS2_DIR" build-tools .ci/report.md
          rc=$?
          set -e
          cat .ci/report.md >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/ci/compat-report.py result --raw-dir .ci/raw --out-dir .ci \
            --build-env "$CS2_DIR/cs2-build.env" --buildid "${{ needs.check.outputs.buildid }}" \
            --trigger "${{ needs.check.outputs.trigger }}" --started-at "${{ needs.check.outputs.started_at }}" \
            || echo "::warning::compat-report.py failed; the verdict below still stands"
          if [ $rc -eq 0 ]; then echo "verdict=pass" >> "$GITHUB_OUTPUT"; else echo "verdict=fail" >> "$GITHUB_OUTPUT"; fi
          exit $rc

      # Repairs what it can in gamedata/ and re-verifies; the autofix job turns it into a PR.
      - name: 'Autofix: readyup_sigfix, then verify again'
        id: autofix
        if: failure() && steps.verify.outputs.verdict == 'fail'
        shell: bash
        env:
          BUILDID: ${{ needs.check.outputs.buildid }}
          PATCH: ${{ steps.verify.outputs.patch_version }}
        run: |
          libs=()
          for m in engine2 tier0 schemasystem; do
            so="$CS2_DIR/game/bin/linuxsteamrt64/lib$m.so"
            [ -f "$so" ] && libs+=(--lib "$m=$so")
          done
          set +e
          build-tools/readyup_sigfix --game-version "$PATCH" --buildid "$BUILDID" \
            "$CS2_DIR/game/csgo/bin/linuxsteamrt64/libserver.so" gamedata/engine-surface.json gamedata/engine-surface.*.json \
            "${libs[@]}" > .ci/sigfix.md
          scripts/ci/verify-cs2.sh "$CS2_DIR" build-tools .ci/report-fixed.md
          rc=$?
          set -e
          cat .ci/sigfix.md >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- gamedata; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "verified=$([ $rc -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          mkdir -p .ci/autofix
          cp gamedata/engine-surface*.json .ci/autofix/
          {
            echo "CS2 $PATCH (build $BUILDID) broke the engine surface, and \`readyup_sigfix\` rewrote what it could find again. Nothing merges this automatically: a wrong match calls the wrong function and crashes servers, so check every new signature."
            echo
            echo "Opened with the workflow token, so CI doesn't start by itself: close and reopen the PR to run it."
            echo
            cat .ci/sigfix.md
            echo
            echo "## Verify again with these files"
            echo
            cat .ci/report-fixed.md
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > .ci/autofix/body.md
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload autofix
        if: always() && steps.autofix.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cs2-autofix-${{ needs.check.outputs.buildid }}
          path: .ci/autofix/
          retention-days: 90

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs2-verify-${{ needs.check.outputs.buildid }}
          path: |
            .ci/report.md
            .ci/compat.json
            .ci/badge.json
            .ci/raw/
            .ci/cs2/cs2-build.env
          if-no-files-found: ignore
          retention-days: 90

  report:
    name: Record + notify
    needs: [check, verify]
    # Only a real verdict is reported/recorded. If the verify job broke for another reason
    # (download error, runner problem) nothing is recorded, so the next run retries.
    if: always() && needs.check.outputs.changed == 'true' && needs.verify.outputs.verdict != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILDID: ${{ needs.check.outputs.buildid }}
      VERDICT: ${{ needs.verify.outputs.verdict }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cs2-verify-${{ needs.check.outputs.buildid }}
          path: report
        continue-on-error: true

      - name: 'Progress event: result'
        continue-on-error: true
        env:
          COMPAT_INGEST_URL: ${{ vars.COMPAT_INGEST_URL }}
          COMPAT_INGEST_TOKEN: ${{ secrets.COMPAT_INGEST_TOKEN }}
        run: |
          if [ -f report/compat.json ]; then
            python3 scripts/ci/compat-report.py post report/compat.json
          else
            echo "::warning::no compat.json in the verify artifact"
          fi

      - name: Notify
        run: |
          if [ "$VERDICT" = "pass" ]; then
            scripts/ci/cs2-watch-report.sh pass "$BUILDID" "$GITHUB_SHA" "$RUN_URL"
          else
            scripts/ci/cs2-watch-report.sh fail "$BUILDID" report/report.md "$RUN_URL"
          fi

      - name: Record state (+ compat.json, badge.json) on branch cs2-build
        env:
          CS2_STATE_FILES: report/compat.json report/badge.json
        run: |
          scripts/ci/cs2-watch-state.sh write "$BUILDID" "${{ needs.check.outputs.surface_sha }}" \
            "$VERDICT" "$GITHUB_SHA" "${{ needs.verify.outputs.patch_version }}"

      - name: Fail on broken surface
        if: env.VERDICT != 'pass'
        run: |
          echo "::error::CS2 build $BUILDID broke gamedata/engine-surface.json; see the verify job summary."
          exit 1

  # readyup_sigfix changed gamedata: commit it to cs2-autofix/<buildid> and open (or refresh) a
  # PR. Only opens it: never approves or merges.
  autofix:
    name: Open autofix PR
    needs: [check, verify]
    if: always() && needs.verify.outputs.autofix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILDID: ${{ needs.check.outputs.buildid }}
      PATCH: ${{ needs.verify.outputs.patch_version }}
      VERIFIED: ${{ needs.verify.outputs.autofix_verified }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cs2-autofix-${{ needs.check.outputs.buildid }}
          path: .ci/autofix

      - name: Commit + open the PR
        run: |
          branch="cs2-autofix/$BUILDID"
          title="fix(gamedata): signatures for CS2 $PATCH (autofix)"
          [ "$VERIFIED" = "true" ] || title="fix(gamedata): signatures for CS2 $PATCH (autofix, still failing)"
          cp .ci/autofix/engine-surface*.json gamedata/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "$title" -m "Written by readyup_sigfix in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push --force origin "$branch"
          pr="$(gh pr list --head "$branch" --state open --json number -q '.[0].number')"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file .ci/autofix/body.md
          else
            gh pr create --head "$branch" --base "$BASE" --title "$title" --body-file .ci/autofix/body.md
          fi

  # The verify job ended without a verdict (download error, runner problem): nothing is
  # recorded on cs2-build (the next run retries), but a listener still hears that this run is over.
  no-verdict:
    name: Report no verdict
    needs: [check, verify]
    if: always() && needs.check.outputs.changed == 'true' && needs.verify.outputs.verdict == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        if: vars.COMPAT_INGEST_URL != ''
        with:
          sparse-checkout: |
            scripts/ci
            gamedata

      - name: 'Progress event: no_verdict'
        if: vars.COMPAT_INGEST_URL != ''
        continue-on-error: true
        env:
          COMPAT_INGEST_URL: ${{ vars.COMPAT_INGEST_URL }}
          COMPAT_INGEST_TOKEN: ${{ secrets.COMPAT_INGEST_TOKEN }}
        run: |
          python3 scripts/ci/compat-report.py phase no_verdict --out .ci/no-verdict.json \
            --buildid "${{ needs.check.outputs.buildid }}" --patch "${{ needs.verify.outputs.patch_version }}" \
            --trigger "${{ needs.check.outputs.trigger }}" --started-at "${{ needs.check.outputs.started_at }}"
          python3 scripts/ci/compat-report.py post .ci/no-verdict.json
