# Post a release to Discord again (DISCORD_WEBHOOK_URL), with this branch's discord-webhook.sh:
# for a release whose own post failed. Actions → Announce → Run workflow, give the version.
name: Announce

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The release to post, e.g. 0.1.0 or 0.1.0-beta.80"
        required: true

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Announce on Discord
        run: bash ./discord-webhook.sh "${{ inputs.version }}"
