name: SDK image mirror

# Copies Valve's Steam Runtime 3 "sniper" SDK image (what build.yml compiles in) to GHCR, next to
# the runners: pulling it from registry.gitlab.steamos.cloud took ~70 s of every build. Weekly, on
# demand, and when this file changes. The package is private (linked to this repo); build.yml
# pulls it with the job's token.

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/workflows/sdk-image.yml']

permissions:
  contents: read
  packages: write

concurrency:
  group: sdk-image
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      SRC: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
      DST: ghcr.io/auto-tournament/ready-up-sniper-sdk:latest
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Copy the image
        run: |
          docker pull "$SRC"
          docker tag "$SRC" "$DST"
          docker push "$DST"
          docker image inspect "$SRC" --format 'size {{.Size}} bytes, id {{.Id}}'
