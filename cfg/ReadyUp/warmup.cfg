// Ready Up warmup baseline (MatchZy-compatible cvars, emulated warmup).
// Executed when Ready Up applies warmup rules (cfg-exec on) and by idle.cfg.
//
// CS2's own warmup is NOT used: its WARMUP text takes over the center panel and
// hides Ready Up's welcome card / ready HUD. Warmup is emulated instead (rounds
// cannot end, respawn, buy anywhere); live.cfg / knife.cfg undo all of it.
// Do not add mp_warmup_start here.

mp_autokick 0
mp_autoteambalance 0
mp_buy_anywhere 1
mp_buytime 9999
mp_death_drop_gun 0
mp_free_armor 0
mp_ignore_round_win_conditions 1
mp_limitteams 0
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1
mp_solid_teammates 0
mp_spectators_max 20
mp_maxmoney 16000
mp_startmoney 16000
mp_timelimit 0
sv_alltalk 0
sv_auto_full_alltalk_during_warmup_half_end 0
sv_deadtalk 1
sv_full_alltalk 0
sv_hibernate_when_empty 0
mp_weapons_allow_typecount -1
sv_infinite_ammo 0
sv_showimpacts 0
sv_voiceenable 1
tv_relayvoice 1
sv_cheats 0
mp_ct_default_melee weapon_knife
mp_ct_default_secondary weapon_hkp2000
mp_ct_default_primary ""
mp_t_default_melee weapon_knife
mp_t_default_secondary weapon_glock
mp_t_default_primary
mp_maxrounds 24
cash_team_bonus_shorthanded 0
mp_team_intro_time 0
mp_freezetime 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_roundtime_hostage 60
// Keep CS2's own warmup off (end it if it is running).
mp_warmuptime 0
mp_warmup_pausetimer 0
mp_warmup_end
