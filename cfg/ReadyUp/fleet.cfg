// Ready Up fleet link: connects this server to the Auto Tournament platform (docs/FLEET.md).
//
// Everything here is commented out, so fleet.so stays idle (standalone server). Uncomment
// `url` plus ONE of `enroll_code` / `enroll_key` to link the server, then restart it or run
// `ru fleet reconnect`. Instead of a code you can also run `ru fleet enroll <url> <code>` in
// the server console. After a successful enrollment the credentials live in
// csgo/readyup/plugins/fleet/credentials.json and the code is no longer needed.
//
// Format: `key = value`, one per line. Lines starting with // or # are ignored. Keys set here
// win over the [fleet] section of readyup/bin/linuxsteamrt64/readyup.cfg.

// Platform base URL. Unset = standalone (fleet.so loads, logs one line and does nothing).
// url = https://tournament.example.com

// One-time code from the platform UI (Servers -> Add server).
// enroll_code = RUE-XXXX-XXXX-XXXX-XXXX

// Or a reusable fleet enrollment key (csm / containers: servers enroll themselves).
// enroll_key = rfk_...

// 1 allows http:// and ws:// to loopback / RFC 1918 hosts (development only).
// insecure_dev = 0

// Extra CA bundle (platform behind a private CA) and optional SPKI pin (base64 sha256).
// ca_file =
// pin_sha256 =

// Minutes offline before a live match is paused (0 disables the timer).
// offline_pause_minutes = 3

// Disk spool for events while offline.
// spool_max_msgs = 50000
// spool_max_mb = 64

// 0 turns the link off even when url is set.
// enabled = 1
