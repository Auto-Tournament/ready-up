// Ready Up esports ruleset (ruleset=valve): executed at go-live instead of ReadyUp/live.cfg.
// Valve CS Major supplemental rulebook, counter-strike_rules_and_regs@8594dc0,
// "Server Settings > Convars" (docs/ESPORTS-MODE.md). Do not edit: put local changes in
// ReadyUp/esports_override.cfg (runs last). Per-match changes: the match config "overrides"
// (sent after this file and the match cvars, so they win).

// 1) Premier defaults, exactly as Valve ships them with the server.
exec gamemode_competitive
exec gamemode_competitive_tmm

// 2) Valve's required exceptions (rulebook L362-418).
tv_enable                                   1
tv_enable1                                  1
tv_dispatchmode                             0
sv_maxusrcmdprocessticks                    3
sv_max_dropped_packets_to_process           3
tv_broadcast                                0   // Valve: 1. Ready Up sets 1 when the match has a tv_broadcast_url
tv_allow_autorecording_index                0
sv_steamauth_enforce                        1
mp_autokick                                 0
sv_matchend_drops_enabled                   0
sv_damage_print_enable                      0
sv_reliableavatardata                       2
sv_invites_only_mainmenu                    1
mp_spectators_max                           10
sv_matchpause_auto_5v5                      1
sv_clockcorrection_msecs                    0
mp_overtime_limit                           0
mp_warmup_pausetimer                        1
mp_warmuptime                               60
mp_halftime_pausematch                      1
mp_competitive_endofmatch_extra_time        155
mp_warmuptime_all_players_connected         0
sv_spec_hear                                4
tv_relayradio                               0
sv_vote_allow_spectators                    1
sv_vote_issue_loadbackup_spec_only          1
sv_vote_issue_loadbackup_spec_authoritative 1
sv_vote_issue_pause_match_spec_only         1
sv_vote_creation_timer                      25
sv_vote_failure_timer                       25
sv_occlude_players                          0
sv_force_transmit_players                   1
sv_force_transmit_ents                      1
sv_holiday_mode                             0
cash_team_bonus_shorthanded                 0
log                                         on
mp_logdetail                                3
mp_logdetail_items                          1
mp_logmoney                                 2
sv_gameinstructor_disable                   1
// game_type 0 / game_mode 1: launch args (they take effect on map load).
// tv_allow_camera_man_steamid: the match config override camera_man_steamid.

// 3) Not Valve rules; needed on a dedicated match server. Premier's base cfg sets bot_quota 1
//    (matchmaking bot fill).
bot_quota                                   0
bot_kick
mp_autoteambalance                          0
mp_limitteams                               0

// 4) Engine defaults for cvars Ready Up's warmup / knife / practice cfgs change and the Premier
//    cfgs do not set (values: `help <cvar>` on CS2 1.41.8), so nothing from before go-live leaks
//    into the match.
mp_ignore_round_win_conditions              0
mp_give_player_c4                           1
mp_ct_default_grenades                      ""
mp_t_default_grenades                       ""
mp_overtime_maxrounds                       6
mp_overtime_startmoney                      10000
mp_c4timer                                  40
mp_halftime_duration                        15
mp_round_restart_delay                      7
mp_death_drop_taser                         1
mp_drop_knife_enable                        0
mp_weapons_allow_typecount                  5
mp_teammates_are_enemies                    0
mp_buy_allow_grenades                       1
weapon_auto_cleanup_time                    0
weapon_max_before_cleanup                   0
ammo_grenade_limit_default                  1
sv_showimpacts                              0
sv_infinite_ammo                            0
sv_cheats                                   0

// 5) TO choices Valve allows (rulebook L421-476). tv_delay is Premier's 105 unless overridden.
mp_disconnect_kills_players                 0
mp_halftime_pausetimer                      0
mp_overtime_halftime_pausetimer             0
spec_replay_enable                          0
sv_voiceenable                              1
mp_endmatch_votenextmap                     0

// 6) Ready Up match management (no gameplay effect).
mp_backup_round_auto                        1
mp_backup_restore_load_autopause            1
mp_match_end_restart                        0
mp_team_intro_time                          0
mp_warmup_end

exec ReadyUp/esports_override.cfg
